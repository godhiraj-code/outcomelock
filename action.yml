name: OutcomeLock stale-work check
description: Fail CI when an agent plan contains completed, superseded, or ambiguous work
inputs:
  plan:
    description: Path to the OutcomeLock JSON plan
    required: true
  database:
    description: Path to an initialized OutcomeLock SQLite evidence database
    required: false
    default: .outcomelock/state.db
  evidence:
    description: Optional JSON evidence file imported atomically before the check
    required: false
    default: ""
  min-confidence:
    description: Minimum confidence for terminal assertions
    required: false
    default: "0.90"
runs:
  using: composite
  steps:
    - shell: bash
      env:
        OUTCOMELOCK_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install "$OUTCOMELOCK_ACTION_PATH"
    - shell: bash
      if: ${{ inputs.evidence != '' }}
      env:
        OUTCOMELOCK_EVIDENCE: ${{ inputs.evidence }}
        OUTCOMELOCK_DATABASE: ${{ inputs.database }}
      run: outcomelock import "$OUTCOMELOCK_EVIDENCE" --db "$OUTCOMELOCK_DATABASE"
    - shell: bash
      env:
        OUTCOMELOCK_PLAN: ${{ inputs.plan }}
        OUTCOMELOCK_DATABASE: ${{ inputs.database }}
        OUTCOMELOCK_MIN_CONFIDENCE: ${{ inputs.min-confidence }}
      run: outcomelock guard "$OUTCOMELOCK_PLAN" --db "$OUTCOMELOCK_DATABASE" --min-confidence "$OUTCOMELOCK_MIN_CONFIDENCE" --report outcomelock-report.html
